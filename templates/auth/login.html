{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <h2>Selamat Datang!</h2>
        <p class="auth-subtitle">Masuk ke akun Anda untuk rekomendasi personal</p>

        <form method="POST">
            <div class="form-group">
                <label for="username"><i class="bi bi-person"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Masukkan username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password"><i class="bi bi-lock"></i> Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Masukkan password" required style="padding-right: 2.5rem;">
                    <button type="button" onclick="togglePassword()" style="position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem;">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem; border-radius: var(--radius-sm);">
                <i class="bi bi-box-arrow-in-right"></i> Masuk
            </button>
        </form>

        <div class="auth-footer">
            Belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar di sini</a>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const pass = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    if (pass.type === 'password') {
        pass.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        pass.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
{% endblock %}
